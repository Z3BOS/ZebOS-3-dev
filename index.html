<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeb OS 3 Pre-Alpha 0.0.3</title>
    <link rel="stylesheet" href="UIKit3/index.css">
</head>
<body class="desktop-wallpaper" style="background-image: url('assets/wallpaper1.jpeg'); background-size: cover; background-position: center; background-repeat: no-repeat;">

    <!-- Retro BIOS Boot Screen -->
    <div id="bios-screen"></div>

    <!-- Clean Boot Splash Screen -->
    <div id="boot-screen">
        <div class="boot-aurora-bg"></div>
        <div class="boot-screen-content">
            <div class="boot-logo-orb">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
                    <path d="M4 5H20L7 19H20" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="boot-title">Zeb<span style="color:#60a5fa; font-weight:600;">OS</span> 3</div>
            <div class="boot-version">Pre-Alpha 0.0.3</div>
            <div id="boot-progress-track">
                <div id="boot-progress-bar"></div>
            </div>
        </div>
    </div>

    <!-- Desktop Workspace Canvas -->
    <div id="desktop-canvas">

        <!-- Desktop Shortcuts Zone -->
        <div id="desktop-icons-zone">
            <div class="desktop-icon" id="icon-editor" title="Double click to open">
                <svg class="sys-icon" viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="16" height="18" rx="2" fill="#ffffff" stroke="#0078d7" stroke-width="1.5"/><path d="M8 7H16M8 11H16M8 15H12" stroke="#0078d7" stroke-width="1.5" stroke-linecap="round"/></svg>
                <div class="desktop-icon-label">Text Editor</div>
            </div>

            <div class="desktop-icon" id="icon-terminal" title="Double click to open">
                <svg class="sys-icon" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="16" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><path d="M6 9L10 12L6 15" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 15H17" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/></svg>
                <div class="desktop-icon-label">Zeb Terminal</div>
            </div>

            <div class="desktop-icon" id="icon-calc" title="Double click to open">
                <svg class="sys-icon" viewBox="0 0 24 24" fill="none"><rect x="4" y="2" width="16" height="20" rx="2" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><rect x="6" y="4" width="12" height="4" rx="1" fill="#9ca3af"/><circle cx="8" cy="11" r="1" fill="#ffffff"/><circle cx="12" cy="11" r="1" fill="#ffffff"/><circle cx="16" cy="11" r="1" fill="#3b82f6"/><circle cx="8" cy="15" r="1" fill="#ffffff"/><circle cx="12" cy="15" r="1" fill="#ffffff"/><circle cx="16" cy="15" r="1" fill="#3b82f6"/><circle cx="8" cy="19" r="1" fill="#ffffff"/><circle cx="12" cy="19" r="1" fill="#ffffff"/><circle cx="16" cy="19" r="1" fill="#10b981"/></svg>
                <div class="desktop-icon-label">Calculator</div>
            </div>

            <div class="desktop-icon" id="icon-taskmgr" title="Double click to open">
                <svg class="sys-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/><path d="M5 14L9 10L13 14L19 7" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <div class="desktop-icon-label">Task Manager</div>
            </div>
        </div>

        <!-- Floating Windows Layer -->
        <div id="window-workspace"></div>

        <!-- Dual-Pane Start Menu -->
        <div id="start-menu" class="hidden-view">
            <div id="start-menu-header">
                <div class="start-user-avatar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" fill="#ffffff"/><path d="M5 20C5 16.134 8.13401 13 12 13C15.866 13 19 16.134 19 20" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/></svg>
                </div>
                <div class="start-user-name">Guest User</div>
            </div>

            <div id="start-menu-panes">
                <div id="start-left-pane">
                    <div class="start-item" id="menu-launch-editor">
                        <svg class="sys-icon" viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="16" height="18" rx="2" fill="#ffffff" stroke="#0078d7" stroke-width="1.5"/><path d="M8 7H16M8 11H16M8 15H12" stroke="#0078d7" stroke-width="1.5" stroke-linecap="round"/></svg>
                        <div class="start-item-text">
                            <span class="start-item-title">Text Editor</span>
                            <span class="start-item-desc">Edit documents</span>
                        </div>
                    </div>
                    <div class="start-item" id="menu-launch-terminal">
                        <svg class="sys-icon" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="16" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><path d="M6 9L10 12L6 15" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 15H17" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/></svg>
                        <div class="start-item-text">
                            <span class="start-item-title">Zeb Terminal</span>
                            <span class="start-item-desc">Command prompt</span>
                        </div>
                    </div>
                    <div class="start-item" id="menu-launch-calc">
                        <svg class="sys-icon" viewBox="0 0 24 24" fill="none"><rect x="4" y="2" width="16" height="20" rx="2" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><rect x="6" y="4" width="12" height="4" rx="1" fill="#9ca3af"/><circle cx="8" cy="11" r="1" fill="#ffffff"/><circle cx="12" cy="11" r="1" fill="#ffffff"/><circle cx="16" cy="11" r="1" fill="#3b82f6"/><circle cx="8" cy="15" r="1" fill="#ffffff"/><circle cx="12" cy="15" r="1" fill="#ffffff"/><circle cx="16" cy="15" r="1" fill="#3b82f6"/><circle cx="8" cy="19" r="1" fill="#ffffff"/><circle cx="12" cy="19" r="1" fill="#ffffff"/><circle cx="16" cy="19" r="1" fill="#10b981"/></svg>
                        <div class="start-item-text">
                            <span class="start-item-title">Calculator</span>
                            <span class="start-item-desc">Math calculations</span>
                        </div>
                    </div>
                    <div class="start-item" id="menu-launch-taskmgr">
                        <svg class="sys-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/><path d="M5 14L9 10L13 14L19 7" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <div class="start-item-text">
                            <span class="start-item-title">Task Manager</span>
                            <span class="start-item-desc">Process monitor</span>
                        </div>
                    </div>

                    <div class="start-all-programs">
                        <span>All Programs</span>
                        <span style="color:#60a5fa;">►</span>
                    </div>
                </div>

                <div id="start-right-pane">
                    <div class="start-sys-item" id="menu-link-documents">
                        <svg class="sys-icon" viewBox="0 0 24 24" fill="none"><path d="M3 6C3 4.89543 3.89543 4 5 4H10L12 6H19C20.1046 6 21 6.89543 21 8V18C21 19.1046 20.1046 20 19 20H5C3.89543 20 3 19.1046 3 18V6Z" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/><rect x="7" y="10" width="10" height="7" rx="1" fill="#ffffff"/><path d="M9 12H15M9 14H13" stroke="#2563eb" stroke-width="1.2" stroke-linecap="round"/></svg>
                        <span>My Documents</span>
                    </div>
                    <div class="start-sys-item" id="menu-link-pictures">
                        <svg class="sys-icon" viewBox="0 0 24 24" fill="none"><path d="M3 6C3 4.89543 3.89543 4 5 4H10L12 6H19C20.1046 6 21 6.89543 21 8V18C21 19.1046 20.1046 20 19 20H5C3.89543 20 3 19.1046 3 18V6Z" fill="#ffca28" stroke="#f57f17" stroke-width="1.5"/><rect x="7" y="10" width="10" height="7" rx="1" fill="#ffffff"/><circle cx="10" cy="12" r="1" fill="#ff9800"/><path d="M8 16L11 13L13 15L15 13L16 16H8Z" fill="#4caf50"/></svg>
                        <span>My Pictures</span>
                    </div>
                    <div class="start-sys-item" id="menu-link-computer">
                        <svg class="sys-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="12" rx="2" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/><path d="M5 5H19V13H5V5Z" fill="#1e293b"/><path d="M8 18H16M12 15V18" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/><rect x="7" y="19" width="10" height="2" rx="1" fill="#475569"/></svg>
                        <span>My Computer</span>
                    </div>

                    <div class="start-sys-separator"></div>

                    <div class="start-sys-item" id="menu-link-control">
                        <svg class="sys-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/><path d="M7 8H17M7 12H17M7 16H17" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="8" r="2" fill="#3b82f6"/><circle cx="14" cy="12" r="2" fill="#10b981"/><circle cx="9" cy="16" r="2" fill="#f59e0b"/></svg>
                        <span>Control Panel</span>
                    </div>
                </div>
            </div>

            <div id="start-menu-footer">
                <input type="text" class="start-search-input" placeholder="Search programs & files...">
                <button class="start-power-btn" onclick="location.reload()">Shut Down</button>
            </div>
        </div>

    </div>

    <!-- Taskbar -->
    <div id="system-taskbar">
        <div id="start-button" title="Start Zeb OS 3">
            <svg class="sys-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 5H20L7 19H20" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <div id="taskbar-tabs-zone"></div>

        <div id="system-tray">
            <span id="live-clock">12:00 PM</span>
        </div>
    </div>

    <script type="module">
        import { createWindow } from './os3.js';
        import { EditorApp } from './programs/editor.js';
        import { TerminalApp } from './programs/terminal.js';
        import { CalcApp } from './programs/calc.js';
        import { TaskMgrApp } from './programs/taskmgr.js';

        // Launcher helper
        const launch = (title, icon, winId, AppClass, w = 600, h = 420) => {
            const body = createWindow(title, icon, winId, w, h);
            if (body) new AppClass(() => { }).open(body);
            document.getElementById('start-menu').classList.add('hidden-view');
        };

        // Desktop Icons (DOUBLE-CLICK)
        document.getElementById('icon-editor').addEventListener('dblclick', () => launch('Text Editor', 'editor', 'app-editor', EditorApp));
        document.getElementById('icon-terminal').addEventListener('dblclick', () => launch('Zeb Terminal', 'terminal', 'app-terminal', TerminalApp));
        document.getElementById('icon-calc').addEventListener('dblclick', () => launch('Calculator', 'calc', 'app-calc', CalcApp, 320, 420));
        document.getElementById('icon-taskmgr').addEventListener('dblclick', () => launch('Task Manager', 'taskmgr', 'app-taskmgr', TaskMgrApp));

        // Start Menu Items (Single Click)
        document.getElementById('menu-launch-editor').addEventListener('click', () => launch('Text Editor', 'editor', 'app-editor', EditorApp));
        document.getElementById('menu-launch-terminal').addEventListener('click', () => launch('Zeb Terminal', 'terminal', 'app-terminal', TerminalApp));
        document.getElementById('menu-launch-calc').addEventListener('click', () => launch('Calculator', 'calc', 'app-calc', CalcApp, 320, 420));
        document.getElementById('menu-launch-taskmgr').addEventListener('click', () => launch('Task Manager', 'taskmgr', 'app-taskmgr', TaskMgrApp));

        // Right pane shortcuts
        document.getElementById('menu-link-documents').addEventListener('click', () => launch('Text Editor', 'editor', 'app-editor-docs', EditorApp));
        document.getElementById('menu-link-pictures').addEventListener('click', () => launch('Text Editor', 'editor', 'app-editor-pics', EditorApp));
        document.getElementById('menu-link-computer').addEventListener('click', () => launch('Task Manager', 'taskmgr', 'app-taskmgr-comp', TaskMgrApp));
        document.getElementById('menu-link-control').addEventListener('click', () => launch('Task Manager', 'taskmgr', 'app-taskmgr-ctrl', TaskMgrApp));
    </script>
</body>
</html>
